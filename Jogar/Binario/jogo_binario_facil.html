<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Board</title>
<link rel="icon" type="image/png" href="imagem\icon.png">
<style>
    * { box-sizing: border-box; }
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 10px;
        background-color: #1a1a24;
        font-family: Arial, sans-serif;
    }
    h1 { color: #333; margin-bottom: 15px; font-size: 20px; text-align: center; }
    .container-principal {
        display: flex;
        flex-direction: row; /* Elementos lado a lado em telas grandes */
        gap: 25px;
        align-items: flex-start;
        justify-content: center;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 800px;
    }
    .zona-jogo {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        flex: 1;
    }
    /* Estrutura do tabuleiro 5x5 dinâmica com CSS Grid */
    .tabuleiro {
        display: grid;
        grid-template-columns: repeat(5, minmax(10px, 20px));
        grid-template-rows: repeat(5, minmax(10px, 20px));
        gap: 2px;
        background-color: #666;
        padding: 4px;
        border-radius: 6px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        max-width: 100%;
    }
    /* Estilo base de cada quadrado (Cinza claro rgb(160, 160, 160)) */
    .casa {
        background-color: rgb(160, 160, 160);
        border-radius: 2px;
        cursor: pointer;
        transition: background-color 0.15s ease;
        aspect-ratio: 1 / 1;
    }
    .casa:hover { opacity: 0.8; }
    /* Classes de cores */
    .preto { background-color: #000000 !important; }
    .branco { background-color: #FFFFFF !important; }
    .vermelho { background-color: #9C1F06 !important; } /* Nova classe para erros */

    /* Painel Lateral do Enigma */
    .painel-enigma {
        width: 95px;
        background-color: #1e1e1e;
        color: #00ff00;
        padding: 15px;
        border-radius: 8px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        max-height: 440px;
        overflow-y: auto;
        word-break: break-all;
    }
    .painel-enigma h3 {
        color: #fff;
        margin-top: 0;
        border-bottom: 1px solid #444;
        padding-bottom: 5px;
        font-size: 14px;
        text-align: center;
    }
    /* Zona de Controles e Botões */
    .controles {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
        width: 100%;
    }
    button {
        padding: 10px 16px;
        font-size: 13px;
        font-weight: bold;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: background-color 0.2s, transform 0.1s;
        flex: 1;
        min-width: 110px;
        text-align: center;
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
        box-shadow: none;
    }
    .btn-comparar { background-color: #007bff; }
    .btn-comparar:hover:not(:disabled) { background-color: #0056b3; }
    .btn-revelar { background-color: #ff9500; }
    .btn-revelar:hover { background-color: #e08200; }
    .btn-reiniciar { background-color: #ff3b30; }
    .btn-reiniciar:hover { background-color: #d32f2f; }
    .resultado-mensagem {
        margin-top: 12px;
        font-weight: bold;
        font-size: 14px;
        color: #333;
        text-align: center;
        min-height: 20px;
    }
    
    /* Botão Voltar Genérico (Usa histórico do navegador) */
   .btn-back {
        display: inline-block;
        padding: 12px 20px;
        background-color: #444466;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
        border: none;
        cursor: pointer;
        width: 100%;
        max-width: 200px;
        box-sizing: border-box;
    }

    /* REGRAS PARA DISPOSITIVOS MÓVEIS (Telas menores que 768px) */
    @media (max-width: 768px) {
        body { justify-content: flex-start; }
        .container-principal {
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 15px;
        }
        .painel-enigma { width: 75%; max-height: 200px; }
        .tabuleiro {
            grid-template-columns: repeat(5, minmax(8px, 16px));
            grid-template-rows: repeat(5, minmax(8px, 16px));
            gap: 1px;
        }
    }
</style>
</head>
<body>

<div class="container-principal">
    <!-- Lado Esquerdo / Topo: O Jogo -->
    <div class="zona-jogo">
        <div class="tabuleiro" id="tabuleiro"></div>
        <div class="controles">
            <button class="btn-reiniciar" onclick="novoJogo()">Novo Jogo</button>
            <button class="btn-comparar" id="btnValidar" onclick="compararMatrizes()">Validar Resposta</button>
            <button class="btn-revelar" onclick="revelarSegredo()">Revelar Enigma</button>
            <button class="btn-back" onclick="window.history.back()">Exit</button>
        </div>
        <div class="resultado-mensagem" id="mensagemFeedback"></div>
    </div>

    <!-- Lado Direito / Baixo: O Enigma Criptografado -->
    <div class="painel-enigma">
        <h3>Enigma</h3>
        <div id="conteudoEnigma">Gerar Enigma..<br></div>
    </div>
</div>

<script>
    const tabuleiro = document.getElementById('tabuleiro');
    const mensagemFeedback = document.getElementById('mensagemFeedback');
    const btnValidar = document.getElementById('btnValidar');
    const TAMANHO = 5; 
    
    let matrizUsuario = [];
    let matrizSecreta = [];

    // Inicializa o jogo automaticamente ao carregar a página
    novoJogo();

    // Inicializa o sistema do jogo
    function novoJogo() {
        mensagemFeedback.textContent = '';
        btnValidar.disabled = false; // Reabilita o botão ao iniciar novo jogo
        gerarMatrizSecreta();
        inicializarTabuleiro();
    }

    // Gera a segunda matriz aleatoriamente (True/False) e renderiza no painel
    function gerarMatrizSecreta() {
        matrizSecreta = [];
        let visualEnigma = "";
        for (let l = 0; l < TAMANHO; l++) {
            let linha = [];
            for (let c = 0; c < TAMANHO; c++) {
                // Cerca de 40% de chance de ser True (Preto)
                let valor = Math.random() < 0.4;
                linha.push(valor);
                visualEnigma += valor ? "1 " : "0 ";
            }
            matrizSecreta.push(linha);
            visualEnigma += "<br>";
        }
        document.getElementById('conteudoEnigma').innerHTML = visualEnigma;
    }

    // Inicializa o tabuleiro visual e a matriz lógica
    function inicializarTabuleiro() {
        tabuleiro.innerHTML = ''; 
        matrizUsuario = []; 
        for (let linha = 0; linha < TAMANHO; linha++) {
            let linhaMatriz = [];
            for (let coluna = 0; coluna < TAMANHO; coluna++) {
                linhaMatriz.push(false);
                const casa = document.createElement('div');
                casa.classList.add('casa');
                casa.dataset.linha = linha;
                casa.dataset.coluna = coluna;
                casa.addEventListener('click', function() {
                    alternarCor(this);
                });
                tabuleiro.appendChild(casa);
            }
            matrizUsuario.push(linhaMatriz);
        }
    }

    // Gerencia a alternância de cores e atualiza a matriz (Cinza -> Preto -> Branco -> Cinza)
    function alternarCor(elemento) {
        elemento.classList.remove('vermelho'); 

        const l = parseInt(elemento.dataset.linha);
        const c = parseInt(elemento.dataset.coluna);

        if (elemento.classList.contains('preto')) {
            // De Preto para Branco
            elemento.classList.remove('preto');
            elemento.classList.add('branco');
            matrizUsuario[l][c] = false;
        } else if (elemento.classList.contains('branco')) {
            // De Branco para Cinza Claro (remove a classe branco, revelando a cor base .casa)
            elemento.classList.remove('branco');
            matrizUsuario[l][c] = false;
        } else {
            // De Cinza Claro para Preto
            elemento.classList.add('preto');
            matrizUsuario[l][c] = true;
        }
    }

    // Compara a matriz do usuário com a matriz secreta criada aleatoriamente
    function compararMatrizes() {
        let acertos = 0;
        const totalElementos = TAMANHO * TAMANHO;
        const casasVisuais = tabuleiro.children;
        let index = 0;

        for (let l = 0; l < TAMANHO; l++) {
            for (let c = 0; c < TAMANHO; c++) {
                const casa = casasVisuais[index];
                
                // Limpa marcações vermelhas anteriores
                casa.classList.remove('vermelho');

                if (matrizUsuario[l][c] === matrizSecreta[l][c]) {
                    acertos++;
                } else {
                    // Pinta de vermelho se o usuário errou esta casa
                    casa.classList.add('vermelho');
                }
                index++;
            }
        }

        const porcentagem = ((acertos / totalElementos) * 100).toFixed(1);

        if (acertos === totalElementos) {
            mensagemFeedback.style.color = "#28a745";
            mensagemFeedback.textContent = "🏆 Perfeito! Você desvendou o enigma por completo!";
            btnValidar.disabled = true; // Bloqueia validação se acertou
        } else {
            mensagemFeedback.style.color = "#007bff";
            mensagemFeedback.textContent = `Progresso: ${porcentagem}% de correspondência (${acertos}/${totalElementos} casas corretas).`;
        }
    }

    // Revela o gabarito instantaneamente e bloqueia o botão de validar
    function revelarSegredo() {
        const casasVisuais = tabuleiro.children;
        let index = 0;
        for (let l = 0; l < TAMANHO; l++) {
            for (let c = 0; c < TAMANHO; c++) {
                const casa = casasVisuais[index];
                casa.classList.remove('preto', 'branco', 'vermelho');
                
                if (matrizSecreta[l][c]) {
                    casa.classList.add('preto');
                    matrizUsuario[l][c] = true;
                } else {
                    casa.classList.add('branco');
                    matrizUsuario[l][c] = false;
                }
                index++;
            }
        }
        mensagemFeedback.style.color = "#ff9500";
        mensagemFeedback.textContent = "O Enigma foi revelado!";
        btnValidar.disabled = true;
    }
</script>
</body>
</html>
