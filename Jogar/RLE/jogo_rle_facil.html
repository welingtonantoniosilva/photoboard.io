<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Board</title>
<link rel="icon" type="image/png" href="imagem\icon.png">
<style>
    * { box-sizing: border-box; }
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 10px;
        background-color: #1a1a24;
        font-family: Arial, sans-serif;
    }
    h1 { color: #333; margin-bottom: 15px; font-size: 20px; text-align: center; }
    .container-principal {
        display: flex;
        flex-direction: row;
        gap: 25px;
        align-items: flex-start;
        justify-content: center;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 800px;
    }
    .zona-jogo {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        flex: 1;
    }
    .tabuleiro {
        display: grid;
        grid-template-columns: repeat(5, minmax(10px, 20px));
        grid-template-rows: repeat(5, minmax(10px, 20px));
        gap: 2px;
        background-color: #666;
        padding: 4px;
        border-radius: 6px;
        box-shadow: 0 8px 166px rgba(0,0,0,0.2);
        max-width: 100%;
    }
    .casa {
        background-color: rgb(160, 160, 160);
        border-radius: 2px;
        cursor: pointer;
        transition: background-color 0.15s ease;
        aspect-ratio: 1 / 1;
    }
    .casa:hover { opacity: 0.8; }
    .cinza { background-color: rgb(160, 160, 160) !important; }
    .preto { background-color: #000000 !important; }
    .branco { background-color: #FFFFFF !important; }
    .vermelho { background-color: #9C1F06 !important; }

    .painel-enigma {
        width: 263px;
        background-color: #1e1e1e;
        color: #00ff00;
        padding: 15px;
        border-radius: 8px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        max-height: 440px;
        overflow-y: auto;
        word-break: break-all;
    }
    .painel-enigma h3 {
        color: #fff;
        margin-top: 0;
        border-bottom: 1px solid #444;
        padding-bottom: 5px;
        font-size: 14px;
        text-align: center;
    }
    .controles {
        display: flex;
        flex-wrap: nowrap; /* Mantém todos os botões na mesma linha */
        justify-content: center;
        gap: 8px;
        margin-top: 15px;
        width: 100%;
    }
    button {
        padding: 10px 12px;
        font-size: 12px;
        font-weight: bold;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: background-color 0.2s, transform 0.1s;
        flex: 1;
        min-width: 0; /* Permite que ajustem perfeitamente ao lado um do outro */
        text-align: center;
        white-space: nowrap;
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
        box-shadow: none;
    }
    .btn-comparar { background-color: #007bff; }
    .btn-comparar:hover:not(:disabled) { background-color: #0056b3; }
    .btn-revelar { background-color: #ff9500; }
    .btn-revelar:hover { background-color: #e08200; }
    .btn-reiniciar { background-color: #ff3b30; }
    .btn-reiniciar:hover { background-color: #d32f2f; }
    .btn-back { background-color: #444466; }
    .btn-back:hover { background-color: #33334d; }

    .resultado-mensagem {
        margin-top: 12px;
        font-weight: bold;
        font-size: 14px;
        color: #333;
        text-align: center;
        min-height: 20px;
    }

    @media (max-width: 768px) {
        body { justify-content: flex-start; }
        .container-principal {
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 15px;
        }
        .painel-enigma { width: 75%; max-height: 200px; }
        .tabuleiro {
            grid-template-columns: repeat(5, minmax(8px, 16px));
            grid-template-rows: repeat(5, minmax(8px, 16px));
            gap: 1px;
        }
    }
</style>
</head>
<body>

<div class="container-principal">
    <div class="zona-jogo">
        <div class="tabuleiro" id="tabuleiro"></div>
        <div class="controles">
            <button class="btn-reiniciar" onclick="novoJogo()">Novo Jogo</button>
            <button class="btn-comparar" id="btnValidar" onclick="compararMatrizes()">Validar</button>
            <button class="btn-revelar" onclick="revelarSegredo()">Revelar</button>
            <button class="btn-back" onclick="window.history.back()">Exit</button>
        </div>
        <div class="resultado-mensagem" id="mensagemFeedback"></div>
    </div>

    <div class="painel-enigma">
        <h3>Enigma</h3>
        <div id="conteudoEnigma">Gerando Enigma...<br></div>
    </div>
</div>

<script>
    const tabuleiro = document.getElementById('tabuleiro');
    const mensagemFeedback = document.getElementById('mensagemFeedback');
    const btnValidar = document.getElementById('btnValidar');
    const TAMANHO = 5; 
    
    let matrizUsuario = [];
    let matrizSecreta = [];

    novoJogo();

    function novoJogo() {
        mensagemFeedback.textContent = '';
        btnValidar.disabled = false;
        gerarMatrizSecreta();
        inicializarTabuleiro();
    }

    function gerarMatrizSecreta() {
        matrizSecreta = [];
        let visualEnigma = "";

        for (let l = 0; l < TAMANHO; l++) {
            let linha = [];
            
            for (let c = 0; c < TAMANHO; c++) {
                let valor = Math.random() < 0.4;
                linha.push(valor);
            }
            matrizSecreta.push(linha);

            let valoresRle = [];
            let contarBranco = true; 
            let contador = 0;

            for (let c = 0; c < TAMANHO; c++) {
                let ehPreto = linha[c]; 

                if (contarBranco) {
                    if (!ehPreto) {
                        contador++; 
                    } else {
                        valoresRle.push(contador);
                        contador = 1; 
                        contarBranco = false; 
                    }
                } else {
                    if (ehPreto) {
                        contador++; 
                    } else {
                        valoresRle.push(contador);
                        contador = 1; 
                        contarBranco = true; 
                    }
                }
            }
            valoresRle.push(contador);

            visualEnigma += valoresRle.join(" ") + "<br>";
        }
        
        document.getElementById('conteudoEnigma').innerHTML = visualEnigma;
    }

    function inicializarTabuleiro() {
        tabuleiro.innerHTML = ''; 
        matrizUsuario = []; 
        for (let linha = 0; linha < TAMANHO; linha++) {
            let linhaMatriz = [];
            for (let coluna = 0; coluna < TAMANHO; coluna++) {
                linhaMatriz.push(null); 
                const casa = document.createElement('div');
                casa.classList.add('casa', 'cinza');
                casa.dataset.linha = linha;
                casa.dataset.coluna = coluna;
                casa.dataset.estado = 'cinza'; 
                casa.addEventListener('click', function() {
                    alternarCor(this);
                });
                tabuleiro.appendChild(casa);
            }
            matrizUsuario.push(linhaMatriz);
        }
    }

    function alternarCor(elemento) {
        elemento.classList.remove('vermelho'); 

        const l = parseInt(elemento.dataset.linha);
        const c = parseInt(elemento.dataset.coluna);
        const estadoAtual = elemento.dataset.estado;

        if (estadoAtual === 'cinza') {
            elemento.classList.remove('cinza', 'preto');
            elemento.classList.add('branco');
            elemento.dataset.estado = 'branco';
            matrizUsuario[l][c] = false; 
        } else if (estadoAtual === 'branco') {
            elemento.classList.remove('branco');
            elemento.classList.add('preto');
            elemento.dataset.estado = 'preto';
            matrizUsuario[l][c] = true; 
        } else if (estadoAtual === 'preto') {
            elemento.classList.remove('preto', 'branco');
            elemento.classList.add('cinza');
            elemento.dataset.estado = 'cinza';
            matrizUsuario[l][c] = null; 
        }
    }

    function compararMatrizes() {
        let acertos = 0;
        const totalElementos = TAMANHO * TAMANHO;
        const casasVisuais = tabuleiro.children;
        let index = 0;

        for (let l = 0; l < TAMANHO; l++) {
            for (let c = 0; c < TAMANHO; c++) {
                const casa = casasVisuais[index];
                
                casa.classList.remove('vermelho');

                const valorUsuario = matrizUsuario[l][c];
                const valorSecreto = matrizSecreta[l][c];

                if (valorUsuario === valorSecreto) {
                    acertos++;
                } else {
                    casa.classList.add('vermelho');
                }
                index++;
            }
        }

        const porcentagem = ((acertos / totalElementos) * 100).toFixed(1);

        if (acertos === totalElementos) {
            mensagemFeedback.style.color = "#28a745";
            mensagemFeedback.textContent = "🏆 Perfeito! Você desvendou o enigma por completo!";
            btnValidar.disabled = true;
        } else {
            mensagemFeedback.style.color = "#007bff";
            mensagemFeedback.textContent = `Progresso: ${porcentagem}% de correspondência (${acertos}/${totalElementos} casas corretas).`;
        }
    }

    function revelarSegredo() {
        const casasVisuais = tabuleiro.children;
        let index = 0;
        for (let l = 0; l < TAMANHO; l++) {
            for (let c = 0; c < TAMANHO; c++) {
                const casa = casasVisuais[index];
                casa.classList.remove('cinza', 'preto', 'branco', 'vermelho');
                
                if (matrizSecreta[l][c]) {
                    casa.classList.add('preto');
                    casa.dataset.estado = 'preto';
                    matrizUsuario[l][c] = true;
                } else {
                    casa.classList.add('branco');
                    casa.dataset.estado = 'branco';
                    matrizUsuario[l][c] = false;
                }
                index++;
            }
        }
        mensagemFeedback.style.color = "#ff9500";
        mensagemFeedback.textContent = "O Enigma foi revelado!";
        btnValidar.disabled = true;
    }

    function reiniciarTabuleiro() {
        inicializarTabuleiro();
    }
</script>
</body>
</html>
