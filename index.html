<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Board</title>
	<link rel="icon" type="image/png" href="imagem\icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #1a1a2e;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #e94560;

        }

        .image-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.5);
        }

        .btn-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-play {
            background-color: #e94560;
            color: white;
            border: none;
        }

        .btn-play:hover {
            background-color: #ff2a59;
            transform: scale(1.05);
        }

        .btn-instructions {
            background-color: #0f3460;
            color: white;
            border: 2px solid #e94560;
        }

        .btn-instructions:hover {
            background-color: #e94560;
            color: white;
            transform: scale(1.05);
        }

        /* Responsividade para telas menores */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="Imagem\imagem.png" alt="Foto do jogo">
    </div>

    <div class="btn-group">
        <a href="jogar.html" class="btn btn-play">Jogar</a>
        <a href="instrucoes.html" class="btn btn-instructions">Instruções</a>
    </div>

</body>
</html>
